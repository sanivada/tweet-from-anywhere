<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      width: 300px;
      padding: 20px;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background: #0f1419;
      color: #e7e9ea;
    }
    h1 {
      font-size: 13px;
      font-weight: 600;
      letter-spacing: 0.4px;
      color: #71767b;
      text-transform: uppercase;
      margin-bottom: 14px;
    }
    textarea {
      width: 100%;
      height: 100px;
      background: #161b22;
      border: 1px solid #2f3336;
      border-radius: 12px;
      padding: 10px 12px;
      color: #e7e9ea;
      font-size: 14px;
      resize: none;
      outline: none;
      transition: border-color 0.15s ease;
    }
    textarea:focus { border-color: #1d9bf0; }
    textarea::placeholder { color: #71767b; }
    button {
      margin-top: 12px;
      width: 100%;
      padding: 10px;
      background: #1d9bf0;
      color: #fff;
      border: none;
      border-radius: 24px;
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
      letter-spacing: 0.2px;
      transition: background 0.15s ease;
    }
    button:hover { background: #1a8cd8; }
    button:active { transform: scale(0.98); }
    #status {
      margin-top: 10px;
      font-size: 11px;
      color: #71767b;
      min-height: 16px;
    }
    #counter.over { color: #f4212e; font-weight: 600; }
  </style>
</head>
<body>
  <h1>Tweet from anywhere</h1>
  <textarea id="tweetText" placeholder="What's happening?" autofocus></textarea>
  <div id="counter" style="font-size: 11px; color: #71767b; text-align: right; margin-top: 4px;">0 / 280</div>
  <button id="publishBtn">Publish</button>
  <div id="status"></div>
  <script src="popup.js"></script>
</body>
</html>
